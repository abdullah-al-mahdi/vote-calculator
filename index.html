<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Vote Calculator</title>
   <link rel="shortcut icon" type="image/x-icon" href="favicon.png">

   <style>
      /*======================================================| 
      =====| RESET
      =======================================================*/
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
      }

      body {
         font-family: system-ui, sans-serif;
         background: #0b1120;
         color: #e5e7eb;
         display: flex;
         align-items: center;
         justify-content: center;
         min-height: 100vh;
         padding: 20px;
      }

      /*======================================================| 
      =====| APP
      =======================================================*/
      .app {
         width: 100%;
         max-width: 800px;
         background: #111827;
         padding: 40px 50px;
         border-radius: 0;
         box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }

      /*======================================================| 
      =====| TITLE
      =======================================================*/
      .title {
         text-align: center;
         margin-bottom: 30px;
         font-size: 32px;
         font-weight: 700;
         letter-spacing: 0.5px;
      }

      /*======================================================| 
      =====| FORM
      =======================================================*/
      .field {
         margin-bottom: 16px;
      }

      .field label {
         display: block;
         font-size: 13px;
         margin-bottom: 8px;
         color: #9ca3af;
      }

      .field input {
         width: 100%;
         height: 54px;
         padding: 0 16px;
         border: 1px solid #1f2937;
         border-radius: 3px;
         background: #020617;
         color: #ffffff;
         font-size: 16px;
         transition: border-color 0.25s ease;
      }

      .field input:focus {
         outline: none;
         border-color: #6366f1;
      }

      .field input::placeholder {
         color: #6b7280;
      }

      /*======================================================| 
      =====| BUTTONS
      =======================================================*/
      .btn-group {
         display: flex;
         gap: 10px;
         margin-top: 40px;
      }

      .btn {
         border: none;
         border-radius: 3px;
         cursor: pointer;
         transition: background 0.25s ease;
      }

      /* Reset Button */
      .btn--reset {
         width: 100px;
         display: flex;
         align-items: center;
         justify-content: center;
         background: #6366f1;
         color: #ffffff;
      }

      .btn--reset:hover {
         background: #4f46e5;
      }

      /* Calculate Button */
      .btn--primary {
         flex: 1;
         height: 54px;
         background: #6366f1;
         color: #ffffff;
         font-size: 16px;
         font-weight: 500;
      }

      .btn--primary:hover {
         background: #4f46e5;
      }

      /*======================================================| 
      =====| RESULT
      =======================================================*/
      .result {
         margin-top: 20px;
         padding: 18px;
         border-radius: 3px;
         background: #020617;
         text-align: center;
         font-size: 20px;
         font-weight: 600;
      }

      .error {
         margin-top: 12px;
         text-align: center;
         color: #f87171;
         font-size: 14px;
      }

      /*======================================================| 
      =====| RESPONSIVE
      =======================================================*/
      @media (max-width: 767px) {

         .app {
            padding: 30px 20px;
         }

         .title {
            font-size: 26px;
         }

         .btn-group {
            margin-top: 30px;
         }

         .btn--reset {
            width: 70px;
         }
      }
   </style>
</head>

<body>
   <!-- |================================================| -->
   <!-- |=======|| App Start ||====================| -->
   <div class="app">
      <!-- Title -->
      <div class="title">
         Deep Work Vote Calculator 🔥
      </div>
      <!-- Session Input -->
      <div class="field">
         <label for="session">
            Time Session
         </label>
         <input type="text" id="session" placeholder="11.23pm:02.14am">
      </div>
      <!-- Buttons -->
      <div class="btn-group">
         <!-- Reset -->
         <button type="button" class="btn btn--reset" id="reset" aria-label="Reset Calculator">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
               <path d="M21 3v5h-5"></path>
               <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
               <path d="M8 16H3v5"></path>
            </svg>
         </button>
         <!-- Calculate -->
         <button type="button" class="btn btn--primary" id="calculate">
            Calculate
         </button>
      </div>
      <!-- Result -->
      <div class="result" id="result">
         Vote: 0 + Minute: 0
      </div>
      <!-- Error -->
      <div class="error" id="error"></div>
   </div>
   <!-- |=======|| App End ||====================| -->
   <!-- |================================================| -->

   <script>
      /**
       * Convert 12-hour time into total minutes
       * Example:
       * 11.23pm
       * 02.14am
       */
      function parseTime(value) {
         const regex = /^(\d{1,2})\.(\d{2})(am|pm)$/i;
         const match = value.match(regex);
         if (!match) {
            return null;
         }
         let hour = parseInt(match[1], 10);
         const minute = parseInt(match[2], 10);
         const meridiem = match[3].toLowerCase();
         if (
            isNaN(hour) ||
            isNaN(minute) ||
            hour < 1 ||
            hour > 12 ||
            minute < 0 ||
            minute > 59
         ) {
            return null;
         }
         /**
          * Convert to 24-hour format
          */
         if (meridiem === 'pm' && hour !== 12) {
            hour += 12;
         }
         if (meridiem === 'am' && hour === 12) {
            hour = 0;
         }
         return (hour * 60) + minute;
      }

      /**
       * Calculate Votes
       */
      document
         .getElementById('calculate')
         .addEventListener('click', function () {
            const sessionVal = document
               .getElementById('session')
               .value
               .trim();
            const resultEl = document.getElementById('result');
            const errorEl = document.getElementById('error');
            errorEl.textContent = '';
            /**
             * Example:
             * 11.23pm:02.14am
             */
            const parts = sessionVal.split(':');
            if (parts.length !== 2) {
               errorEl.textContent =
                  'Use format: 11.23pm:02.14am';
               return;
            }
            const start = parseTime(parts[0].trim());
            const end = parseTime(parts[1].trim());
            if (start === null || end === null) {
               errorEl.textContent =
                  'Invalid time format';
               return;
            }
            let diff = end - start;
            /**
             * Handle next day
             */
            if (diff < 0) {
               diff += 1440;
            }
            const votes = Math.floor(diff / 15);
            const remaining = diff % 15;
            resultEl.textContent =
               `Vote: ${votes} + Minute: ${remaining}`;
         });

      /**
       * Reset Calculator
       */
      document
         .getElementById('reset')
         .addEventListener('click', function () {
            document.getElementById('session').value = '';
            document.getElementById('result').textContent =
               'Vote: 0 + Minute: 0';
            document.getElementById('error').textContent = '';
         });
      /**
       * Press Enter to Calculate
       */
      document
         .getElementById('session')
         .addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
               document
                  .getElementById('calculate')
                  .click();
            }
         });
   </script>
</body>

</html>
