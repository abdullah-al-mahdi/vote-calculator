<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Vote Calculator</title>
   <link rel="shortcut icon" type="image/x-icon" href="favicon.png">

   <style>
      /* ================= RESET ================= */
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
      }

      body {
         font-family: system-ui, sans-serif;
         background: #0b1120;
         color: #e5e7eb;
         display: flex;
         align-items: center;
         justify-content: center;
         height: 100vh;
      }

      /* ================= APP ================= */
      .app {
         width: 100%;
         max-width: 800px;
         background: #111827;
         padding: 40px 50px 40px;
         border-radius: 0px;
         box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
         margin-bottom: 100px;
      }

      /* ================= TITLE ================= */
      .title {
         text-align: center;
         margin-bottom: 25px;
         font-size: 28px;
         font-weight: 600;
         letter-spacing: 0.5px;
      }

      /* ================= FORM ================= */
      .field {
         margin-bottom: 16px;
      }

      .field label {
         display: block;
         font-size: 13px;
         margin-bottom: 6px;
         color: #9ca3af;
      }

      .field input {
         width: 100%;
         padding: 12px;
         border-radius: 3px;
         border: 1px solid #1f2937;
         background: #020617;
         color: #fff;
         font-size: 16px;
      }

      .field input:focus {
         outline: none;
         border-color: #6366f1;
      }

      /* ================= BUTTONS ================= */
      .btn-group {
         display: flex;
         gap: 10px;
         margin-top: 50px;
      }

      .btn {
         border: none;
         border-radius: 3px;
         cursor: pointer;
         transition: 0.25s;
      }

      .btn svg {
         color: #ffffff;
      }

      /* Reset Button */
      .btn--reset {
         width: 100px;
         display: flex;
         align-items: center;
         justify-content: center;
         background: #6366f1;
      }

      .btn--reset:hover {
         background: #4f46e5;
      }

      /* Calculate Button */
      .btn--primary {
         flex: 1;
         padding: 12px;
         background: #6366f1;
         color: #fff;
         font-size: 16px;
      }

      .btn--primary:hover {
         background: #4f46e5;
      }

      /* ================= RESULT ================= */
      .result {
         margin-top: 20px;
         padding: 15px;
         border-radius: 3px;
         background: #020617;
         text-align: center;
         font-size: 18px;
         font-weight: 500;
      }

      .error {
         margin-top: 10px;
         text-align: center;
         color: #f87171;
         font-size: 14px;
      }
   </style>
</head>


<body>
   <div class="app">
      <div class="title">Deep Work Vote Calculator 🔥</div>
      <div class="field">
         <label>Start Time (HH.MM)</label>
         <input type="text" id="start" placeholder="11.23">
      </div>
      <div class="field">
         <label>End Time (HH.MM)</label>
         <input type="text" id="end" placeholder="02.14">
      </div>
      <div class="btn-group">
         <!-- RESET -->
         <button class="btn btn--reset" id="reset">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="lucide lucide-refresh-cw-icon lucide-refresh-cw">
               <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
               <path d="M21 3v5h-5" />
               <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
               <path d="M8 16H3v5" />
            </svg>
         </button>
         <!-- CALCULATE -->
         <button class="btn btn--primary" id="calculate">Calculate</button>
      </div>
      <div class="result" id="result">Vote: 0 + Minute: 0</div>
      <div class="error" id="error"></div>
   </div>

   <script>
      /**
       * Convert HH.MM to minutes
       */
      function parseTime(value) {
         const parts = value.split('.');
         if (parts.length !== 2) return null;
         const h = parseInt(parts[0], 10);
         const m = parseInt(parts[1], 10);
         if (isNaN(h) || isNaN(m) || m >= 60 || h > 12 || h < 0) {
            return null;
         }
         return (h * 60) + m;
      }

      /**
       * Calculate Votes
       */
      document.getElementById('calculate').addEventListener('click', function () {
         const startVal = document.getElementById('start').value.trim();
         const endVal = document.getElementById('end').value.trim();
         const resultEl = document.getElementById('result');
         const errorEl = document.getElementById('error');
         errorEl.textContent = '';
         const start = parseTime(startVal);
         const end = parseTime(endVal);
         if (start === null || end === null) {
            errorEl.textContent = 'Use format HH.MM (example: 11.23)';
            return;
         }
         let diff = end - start;
         /**
          * If end < start → assume same day (AM → PM)
          */
         if (diff < 0) {
            diff += 720; // 12 hours
         }
         const votes = Math.floor(diff / 15);
         const remaining = diff % 15;
         resultEl.textContent = `Vote: ${votes} + Minute: ${remaining}`;
      });

      /**
       * Reset Function
       */
      document.getElementById('reset').addEventListener('click', function () {
         document.getElementById('start').value = '';
         document.getElementById('end').value = '';
         document.getElementById('result').textContent = 'Vote: 0 + Minute: 0';
         document.getElementById('error').textContent = '';
      });
   </script>
</body>

</html>
